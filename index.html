<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>大陸用語 → 台灣用語 轉換工具</title>
<style>
    body {
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        background: #f7f7f7;
        padding: 40px;
    }
    .box {
        max-width: 760px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }
    h1 {
        margin-top: 0;
        font-size: 24px;
    }
    input[type=file] {
        margin: 20px 0;
    }
    button {
        padding: 10px 22px;
        font-size: 16px;
        cursor: pointer;
    }
    .hint {
        margin-top: 15px;
        color: #666;
        font-size: 14px;
        line-height: 1.6;
    }
</style>
</head>
<body>

<div class="box">
    <h1>大陸用語 → 台灣用語 自動轉換</h1>

    <input type="file" id="fileInput" />
    <br>
    <button onclick="convertFile()">開始轉換並下載</button>

    <div class="hint">
        ✔ 支援 TXT / SRT / 字幕檔<br>
        ✔ 不影響時間碼，只轉換文字<br>
        ✔ 台灣口語與字幕用語優先
    </div>
</div>

<script>
/* ======================================
   大陸用語 → 台灣用語 對照表
   （依字幕／口語自然度排序）
====================================== */
const replaceMap = [

    /* ===== 常見網路／口語 ===== */
    ["實錘", "證據確鑿"],
    ["中二病", "中二"],
    ["蛤？", "蝦？"],
    ["老子", "本大爺"],
    ["耶", "欸"],
    ["拆台", "砸場子"],
    ["狐群狗黨", "狐群狗黨"],
    ["卷走", "捲走"],
    ["退休金福利", "退休金"],
    ["一個願打一個願挨", "一個願打，一個願挨"],
    ["賬戶", "帳戶"],
    ["條子", "警察"],
    ["我覺得吧", "我覺得"],
    ["毒虫", "毒蟲"],
    ["混血兒", "混血兒"],
    ["琢磨", "思考"],
    ["哥們", "兄弟"],
    ["翻牆", "翻牆"],
    ["全息影像", "全像投影"],
    ["學貸", "助學貸款"],
    ["退學", "被退學"],

    /* ===== 你前一輪提供的詞彙 ===== */
    ["罷演", "停演"],
    ["循線追踪", "循線追蹤"],
    ["同事", "夥伴"],
    ["戲法", "把戲"],
    ["扒手", "小偷"],
    ["亮出來", "秀出來"],
    ["挺到位", "很到位"],
    ["多琢磨", "多研究"],
    ["賺翻了", "賺爆了"],
    ["私闖民宅", "侵入民宅"],
    ["老兄", "老哥"],
    ["搞定了", "成了"],
    ["天曉得", "誰知道"],
    ["喂！", "欸！"],
    ["混蛋！", "王八蛋！"],
    ["小餅干", "小朋友"],
    ["真妙欸", "挺妙的"],

    /* ===== 句型轉換（自然台灣語序） ===== */
    [
        "大家仔細想想，女士們先生們，準備好大開眼界吧。",
        "各位先生女士，請仔細看好，準備大開眼界吧。"
    ],
    ["這回我能搞定", "這次我搞得定"],
    ["妳就像個小瑪利歐", "妳簡直跟瑪利歐一樣"]
];

/* ======================================
   轉換邏輯
====================================== */
function convertText(text) {
    let result = text;
    replaceMap.forEach(([from, to]) => {
        const reg = new RegExp(from, "g");
        result = result.replace(reg, to);
    });
    return result;
}

function convertFile() {
    const input = document.getElementById("fileInput");
    if (!input.files.length) {
        alert("請先選擇檔案");
        return;
    }

    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const originalText = e.target.result;
        const convertedText = convertText(originalText);

        const blob = new Blob([convertedText], {
            type: "text/plain;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(
            /(\.\w+)?$/,
            "_台灣慣用語版$1"
        );
        a.click();

        URL.revokeObjectURL(url);
    };

    reader.readAsText(file, "UTF-8");
}
</script>

</body>
</html>
