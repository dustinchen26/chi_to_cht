/* ======================================
   轉換邏輯
====================================== */
function convertText(text) {
    let result = text;
    // 使用正則表達式進行全局替換
    replaceMap.forEach(([from, to]) => {
        const reg = new RegExp(from, "gi"); 
        result = result.replace(reg, to);
    });
    return result;
}

function convertFile() {
    const input = document.getElementById("fileInput");
    if (!input.files.length) {
        alert("請先選擇檔案");
        return;
    }

    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const originalText = e.target.result;
        const convertedText = convertText(originalText);

        const blob = new Blob([convertedText], {
            type: "text/plain;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(
            /(\.\w+)?$/,
            "_專業術語校正版$1"
        );
        a.click();

        URL.revokeObjectURL(url);
    };

    reader.readAsText(file, "UTF-8");
}
